name: Build Redmi AC2100
on: [push]

jobs:
    build:
        name: Prepare and build Redmi AC2100 images
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v2

            - name: Update and install feeds
              run: |
                ./scripts/feeds update -a
                ./scripts/feeds install -a

            - name: Generate config for Redmi AC2100
              run: |
                cp diff .config
                make defconfig

            - name: Download package sources
              run: make download V=s

            - name: Build tools
              run: |
                make tools/install -j$(nproc) V=s || \
                make tools/install V=s

            - name: Build toolchain
              run: |
                make toolchain/install -j$(nproc) V=s || \
                make toolchain/install V=s

            - name: Build target images
              run: |
                make -j$(nproc) V=s || \
                make V=s

            - name: TAR output
              run: tar -cvf rm2100-images.tar bin/targets/ramips/mt7621

            - name: Upload artifacts
              uses: actions/upload-artifact@v2
              with:
                name: rm2100-images
                path: rm2100-images.tar

    release:
          name: Make a release
          runs-on: ubuntu-latest
          needs: build

          steps:
            - name: Download the image artifacts
              uses: actions/download-artifact@v2
              with:
                name: rm2100-images

            - name: Extract the image artifacts
              run: tar xf rm2100-images.tar

            - name: Create a release
              uses: "marvinpinto/action-automatic-releases@latest"
              with:
                repo_token: "${{ secrets.GITHUB_TOKEN }}"
                prerelease: true
                title: "Updated prebuilt images"
                automatic_release_tag: "rm2100-latest"
                files: bin/targets/ramips/mt7621/*
